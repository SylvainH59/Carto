<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="content-type" content="text/html; charset=UTF-8">
  <title>Plan IGN v2 TMS en style classique</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script type="text/javascript" src="https://unpkg.com/maplibre-gl@1.15.2/dist/maplibre-gl.js"></script>
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/maplibre-gl@1.15.2/dist/maplibre-gl.css">
  <style type="text/css">
	  body { margin: 0; padding: 0; }
	  #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
<body>
    
<div id="map"></div>
  <script type="text/javascript">
    const url_style = "geojson/standard.json";
    fetch(url_style).then(res => res.json()).then(style => {
      // Patcher le schéma tms sur xyz pour le rendre compatible avec Maplibre GL JS / Mapbox GL JS 
      style.sources.plan_ign.scheme = 'xyz';
      style.sources.plan_ign.attribution = 'Données cartographiques : © IGN';
      const map = new maplibregl.Map({
        container: 'map', // id du conteneur
        style: style, // url du style
        center: [2.8260685, 50.5958040], // centre de la carte
        zoom: 14, // zoom
        attributionControl: false
      });
      map.addControl(new maplibregl.AttributionControl({compact: true}));
    })
  </script>
</body>
</html>
