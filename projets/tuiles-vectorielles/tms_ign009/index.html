<!DOCTYPE html>
<html>

  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <title>BDTOPO TMS routier</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- MapLibre -->
    <script src="https://unpkg.com/maplibre-gl@1.15.2/dist/maplibre-gl.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@1.15.2/dist/maplibre-gl.css">

    <style>
      /* Page */
      body {
        margin: 0;
        padding: 0;
      }

      /* Carte */
      #map {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
      }

      /* Sélecteur de fond */
      #basemap-selector {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 10;
        padding: 6px 10px;
        background: white;
        border: 1px solid #aaa;
        border-radius: 3px;
        font-size: 14px;
      }

      /* Légende */
      #legend {
        position: absolute;
        bottom: 30px;
        left: 10px;
        z-index: 10;
        font-family: Arial, sans-serif;
        font-size: 13px;
      }

      /* Bouton légende */
      #legend-header {
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid #aaa;
        border-radius: 4px;
        padding: 8px 12px;
        font-weight: bold;
        cursor: pointer;
        user-select: none;
        box-shadow:
          0 1px 4px rgba(0, 0, 0, 0.2);
      }

      #legend-header:hover {
        background: #f5f5f5;
      }

      /* Contenu de la légende */
      #legend-content {
        display: none;
        margin-top: 5px;
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid #aaa;
        border-radius: 4px;
        padding: 12px 15px;
        min-width: 220px;
        max-height: calc(100vh - 100px);
        overflow-y: auto;
        box-shadow:
          0 1px 4px rgba(0, 0, 0, 0.2);
      }

      /* Légende ouverte */
      #legend.open #legend-content {
        display: block;
      }

      /* Titre de la légende */
      #legend-title {
        font-weight: bold;
        font-size: 16px;
        margin-bottom: 10px;
      }

      /* Éléments de la légende */
      .legend-item {
        display: flex;
        align-items: center;
        margin: 5px 0;
      }

      /* Symboles surfaciques de la légende */
      .legend-symbol {
        width: 18px;
        height: 14px;
        margin-right: 8px;
        border: 1px solid #666;
        box-sizing: border-box;
        flex-shrink: 0;
      }

      /* Symboles linéaires de la légende */
      .legend-line {
        width: 20px;
        height: 3px;
        margin-right: 8px;
        flex-shrink: 0;
      }

      /* Message si aucun élément dans la légende */
      .legend-empty {
        color: #777;
        font-style: italic;
      }
    </style>
  </head>

  <body>

    <!-- Sélecteur de fond -->
    <select id="basemap-selector">
      <option value="white">Fond blanc</option>
      <option value="ortho">Orthophoto</option>
      <option value="osm">OpenStreetMap</option>
    </select>

    <!-- Carte -->
    <div id="map"></div>

    <!-- Légende -->
    <div id="legend">

      <!-- Bouton -->
      <div id="legend-header">
        Légende
      </div>

      <!-- Contenu -->
      <div id="legend-content">
        <!-- Le contenu sera créé automatiquement à partir de bati_etages.json -->
        <div id="legend-items"></div>
      </div>

    </div>

    <script>
      /* Style BDTOPO */
      const url_style = "geojson/routier.json";

      /* Chargement du style */
      fetch(url_style)
        .then(res => res.json())
        .then(style => {

          /* Création de la carte */
          const map = new maplibregl.Map({
            container: 'map',
            style: style,
            center: [2.82392, 50.59328],
            zoom: 16,
            attributionControl: false
          });

          /* Attribution de la carte */
          map.addControl(
            new maplibregl.AttributionControl({
              compact: true
            })
          );

          /* Chargement de la carte */
          map.on('load', function () {

            /* Sources des fonds */

            /* OpenStreetMap */
            map.addSource('osm', {
              type: 'raster',
              tiles: [
                'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
              ],
              tileSize: 256,
              opacity: 0.7,
              attribution: '© OpenStreetMap contributors'
            });

            /* Orthophoto IGN */
            map.addSource('ortho', {
              type: 'raster',
              tiles: [
                'https://data.geopf.fr/wmts?' +
                'SERVICE=WMTS' +
                '&REQUEST=GetTile' +
                '&VERSION=1.0.0' +
                '&LAYER=ORTHOIMAGERY.ORTHOPHOTOS' +
                '&STYLE=normal' +
                '&FORMAT=image/jpeg' +
                '&TILEMATRIXSET=PM' +
                '&TILEMATRIX={z}' +
                '&TILEROW={y}' +
                '&TILECOL={x}'
              ],
              tileSize: 256,
              opacity: 0.5,
              attribution: '© IGN'
            });

            /* Couches de fond */

            /* Fond blanc */
            map.addLayer({
              id: 'fond-blanc',
              type: 'background',
              paint: {
                'background-color': '#ffffff'
              }
            }, getFirstLayerId());

            /* OpenStreetMap */
            map.addLayer({
              id: 'fond-osm',
              type: 'raster',
              source: 'osm'
            }, getFirstLayerId());

            /* Orthophoto IGN */
            map.addLayer({
              id: 'fond-ortho',
              type: 'raster',
              source: 'ortho'
            }, getFirstLayerId());

            /* Fond par défaut */
            setBasemap('ortho');

            document
              .getElementById('basemap-selector')
              .value = 'ortho';

            /* Sélecteur de fond */
            document
              .getElementById('basemap-selector')
              .addEventListener(
                'change',
                function () {
                  setBasemap(this.value);
                }
              );

            /* Génération de la légende */
            createLegend();

            /* Ouverture / fermeture de la légende */
            document
              .getElementById('legend-header')
              .addEventListener('click', function () {

                const legend = document.getElementById('legend');

                legend.classList.toggle('open');

                this.textContent =
                  legend.classList.contains('open')
                    ? 'Type de route'
                    : 'Légende';
              });

            /* Fonction de changement de fond */
            function setBasemap(basemap) {

              map.setLayoutProperty(
                'fond-blanc',
                'visibility',
                basemap === 'white'
                  ? 'visible'
                  : 'none'
              );

              map.setLayoutProperty(
                'fond-osm',
                'visibility',
                basemap === 'osm'
                  ? 'visible'
                  : 'none'
              );

              map.setLayoutProperty(
                'fond-ortho',
                'visibility',
                basemap === 'ortho'
                  ? 'visible'
                  : 'none'
              );
            }

            /* Première couche de style */
            function getFirstLayerId() {

              const layers =
                map.getStyle().layers;

              if (
                layers &&
                layers.length > 0
              ) {
                return layers[0].id;
              }

              return undefined;
            }

            /* Création automatique de la légende */
            function createLegend() {

              const legendItems =
                document.getElementById(
                  'legend-items'
                );

              /* On vide la légende */
              legendItems.innerHTML = '';

              /* Récupération des couches */
              const layers =
                map.getStyle().layers;

              /* Permet d'éviter les doublons */
              const alreadyAdded =
                new Set();

              /* Parcours des couches */
              layers.forEach(function (layer) {

                /* On ne conserve que les tronçons de route */
                if (layer['source-layer'] !== 'troncon_de_route') {
                  return;
                }

                /* On ne traite que les couches linéaires*/
                if (
                  layer.type !== 'line'
                ) {
                  return;
                }

                /* Récupération de la couleur */
                let color = null;

                if (layer.type === 'line') {

                  if (
                    layer.paint &&
                    layer.paint['line-color']
                  ) {
                    color =
                      layer.paint['line-color'];
                  }
                }

                /* Pas de couleur = pas de légende */
                if (!color) {
                  return;
                }

                /* Correspondance entre les identifiants des couches et les libellés */
                const labels = {
                  "type_autoroutier": "Type autoroutier",
                  "route_a_deux_chaussees": "Route à deux chaussées",
                  "route_a_une_chaussee": "Route à une chaussée",
                  "bretelle": "Bretelle",
                  "rond-point": "Rond-point",
                  "route-empierre": "Route empierrée",
                  "piste-cyclable": "Piste cyclable",
                  "chemin": "Chemin",
                  "escalier-outline": "Escalier outline",
                  "escalier-inline": "Escalier inline",
                  "sentier-outline": "Sentier outline",
                  "sentier-inline": "Sentier inline"
                };
                
                /* Récupération du libellé depuis l'identifiant de la couche */
                let label = labels[layer.id];

                /* Clé permettant d'éviter les doublons */
                const key =
                  (layer['source-layer'] || '') +
                  '|' +
                  label;

                if (
                  alreadyAdded.has(key)
                ) {
                  return;
                }

                alreadyAdded.add(key);

                /* Création de l'élément HTML */
                const item =
                  document.createElement('div');

                item.className =
                  'legend-item';

                /* Création du symbole */
                const symbol =
                  document.createElement('span');

                /* Couches surfaciques */
                if (layer.type === 'fill') {

                  symbol.className =
                    'legend-symbol';

                  symbol.style.backgroundColor =
                    color;

                  symbol.style.opacity =
                    opacity;

                  /* Recherche de la couche correspondant aux limites */
                  const limiteLayer =
                    layers.find(function (l) {

                      return (
                        l['source-layer'] ===
                        layer['source-layer']
                        &&
                        l.id ===
                        layer.id.replace(
                          /_surf$/,
                          '_limites'
                        )
                      );
                    });

                  /* Utilisation de la couleur de contour */
                  if (
                    limiteLayer &&
                    limiteLayer.paint &&
                    limiteLayer.paint['line-color']
                  ) {
                    symbol.style.borderColor =
                      limiteLayer.paint['line-color'];
                  }
                }

                /* Couches linéaires */
                else {

                  symbol.className =
                    'legend-line';

                  symbol.style.backgroundColor =
                    color;
                }

                /* Texte */
                const text =
                  document.createElement('span');

                text.textContent =
                  label;

                /* Assemblage */
                item.appendChild(symbol);
                item.appendChild(text);
                legendItems.appendChild(item);
              });

              /* Si aucun élément */
              if (
                legendItems.children.length === 0
              ) {

                const empty =
                  document.createElement('div');

                empty.className =
                  'legend-empty';

                empty.textContent =
                  'Aucun élément à afficher';

                legendItems.appendChild(empty);
              }
            }
          });
        })

        .catch(function (error) {

          console.error(
            'Erreur lors du chargement du style BDTOPO :',
            error
          );
        });
    </script>

  </body>

</html>
