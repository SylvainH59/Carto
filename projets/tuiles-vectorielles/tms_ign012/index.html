<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <title>BDTOPO TMS - Eoliennes animées en 3D avec Three.js</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.3.0/dist/maplibre-gl.css" />
    <script src="https://unpkg.com/maplibre-gl@5.3.0/dist/maplibre-gl.js"></script>
    <style>
      html, body, #map {
        margin: 0;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
        }
      }
    </script>

    <div id="map"></div>

    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

      const map = new maplibregl.Map({
        container: 'map',
        style: 'geojson/bdtopo_perso.json',
        center: [2.74223, 49.85253],
        zoom: 15,
        pitch: 60,
        bearing: -20
      });

      const modelUrl = '3d/animated_wind_turbine/animated_wind_turbine.glb';
      const modelRotate = [Math.PI / 2, 0, 0];
      const modelScale = 0.02;

      const loadedEoliennes = new Set(); // pour éviter les doublons
      const turbineLayers = new Map();   // pour suivre les couches ajoutées
      const loader = new GLTFLoader();

      function updateWindTurbines() {
        if (map.getZoom() < 15) {
          // Nettoyer toutes les éoliennes si on descend sous le seuil
          for (const id of loadedEoliennes) {
            const layerId = turbineLayers.get(id);
            if (map.getLayer(layerId)) map.removeLayer(layerId);
            turbineLayers.delete(id);
            loadedEoliennes.delete(id);
          }
          return;
        }

        const features = map.querySourceFeatures('bdtopo', {
          sourceLayer: 'construction_ponctuelle',
          filter: ['==', 'nature', 'Eolienne']
        });

        const visibleIds = new Set();

        for (const feature of features) {
          const coord = feature.geometry.coordinates;
          const id = `${coord[0].toFixed(5)}-${coord[1].toFixed(5)}`;
          visibleIds.add(id);

          if (loadedEoliennes.has(id)) continue;

          loadedEoliennes.add(id);

          const merc = maplibregl.MercatorCoordinate.fromLngLat(coord, 0);
          const transform = {
            translateX: merc.x,
            translateY: merc.y,
            translateZ: merc.z,
            rotateX: modelRotate[0],
            rotateY: modelRotate[1],
            rotateZ: modelRotate[2],
            scale: merc.meterInMercatorCoordinateUnits() * modelScale
          };

          loader.load(modelUrl, (gltf) => {
            const scene = new THREE.Scene();
            const camera = new THREE.Camera();

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(0, -70, 100).normalize();
            scene.add(directionalLight);

            const model = gltf.scene;
            scene.add(model);

            const mixer = new THREE.AnimationMixer(model);
            gltf.animations.forEach((clip) => mixer.clipAction(clip).play());

            let lastTime = performance.now();

            const customLayer = {
              id: 'eolienne-' + id,
              type: 'custom',
              renderingMode: '3d',

              onAdd: function (map, gl) {
                this.camera = camera;
                this.scene = scene;
                this.renderer = new THREE.WebGLRenderer({
                  canvas: map.getCanvas(),
                  context: gl,
                  antialias: true
                });
                this.renderer.autoClear = false;
              },

              render: function (gl, matrix) {
                const now = performance.now();
                const delta = (now - lastTime) / 1000;
                lastTime = now;

                mixer.update(delta);

                const rotationX = new THREE.Matrix4().makeRotationAxis(
                  new THREE.Vector3(1, 0, 0),
                  transform.rotateX
                );
                const rotationY = new THREE.Matrix4().makeRotationAxis(
                  new THREE.Vector3(0, 1, 0),
                  transform.rotateY
                );
                const rotationZ = new THREE.Matrix4().makeRotationAxis(
                  new THREE.Vector3(0, 0, 1),
                  transform.rotateZ
                );

                const m = new THREE.Matrix4().fromArray(
                  matrix.defaultProjectionData.mainMatrix
                );

                const l = new THREE.Matrix4()
                  .makeTranslation(
                    transform.translateX,
                    transform.translateY,
                    transform.translateZ
                  )
                  .scale(
                    new THREE.Vector3(
                      transform.scale,
                      -transform.scale,
                      transform.scale
                    )
                  )
                  .multiply(rotationX)
                  .multiply(rotationY)
                  .multiply(rotationZ);

                this.camera.projectionMatrix = m.multiply(l);
                this.renderer.resetState();
                this.renderer.render(this.scene, this.camera);
                map.triggerRepaint();
              }
            };

            map.addLayer(customLayer);
            turbineLayers.set(id, customLayer.id);
          });
        }

        // Nettoyage des éoliennes hors de la vue
        for (const id of loadedEoliennes) {
          if (!visibleIds.has(id)) {
            const layerId = turbineLayers.get(id);
            if (map.getLayer(layerId)) map.removeLayer(layerId);
            turbineLayers.delete(id);
            loadedEoliennes.delete(id);
          }
        }
      }

      map.on('load', () => {
        updateWindTurbines();
        map.on('moveend', updateWindTurbines);
        map.on('zoomend', updateWindTurbines);
      });
    </script>
  </body>
</html>
