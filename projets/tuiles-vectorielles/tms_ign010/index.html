<!DOCTYPE html>
<html>

  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <title>BDTOPO TMS routier</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- MapLibre -->
    <script src="https://unpkg.com/maplibre-gl@1.15.2/dist/maplibre-gl.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@1.15.2/dist/maplibre-gl.css">

    <style>
      /* Page */
      body {
        margin: 0;
        padding: 0;
      }

      /* Carte */
      #map {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
      }

      /* Sélecteur de fond */
      #basemap-selector {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 10;
        padding: 6px 10px;
        background: white;
        border: 1px solid #aaa;
        border-radius: 3px;
        font-size: 14px;
      }

      /* Légende */
      #legend {
        position: absolute;
        bottom: 30px;
        left: 10px;
        z-index: 10;
        font-family: Arial, sans-serif;
        font-size: 13px;
      }

      /* Bouton légende */
      #legend-header {
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid #aaa;
        border-radius: 4px;
        padding: 8px 12px;
        font-weight: bold;
        cursor: pointer;
        user-select: none;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
      }

      #legend-header:hover {
        background: #f5f5f5;
      }

      /* Contenu de la légende */
      #legend-content {
        display: none;
        margin-top: 5px;
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid #aaa;
        border-radius: 4px;
        padding: 12px 15px;
        min-width: 220px;
        max-height: calc(100vh - 100px);
        overflow-y: auto;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
      }

      /* Légende ouverte */
      #legend.open #legend-content {
        display: block;
      }

      /* Titre de la légende */
      #legend-title {
        font-weight: bold;
        font-size: 16px;
        margin-bottom: 10px;
      }

      /* Éléments de la légende */
      .legend-item {
        display: flex;
        align-items: center;
        margin: 5px 0;
      }

      /* Symboles surfaciques de la légende */
      .legend-symbol {
        width: 18px;
        height: 14px;
        margin-right: 8px;
        border: 1px solid #666;
        box-sizing: border-box;
        flex-shrink: 0;
      }

      /* Symboles linéaires de la légende */
      .legend-line {
        display: block;
        width: 30px;
        height: 10px;
        margin-right: 8px;
        flex-shrink: 0;
      }

      /* Message si aucun élément dans la légende */
      .legend-empty {
        color: #777;
        font-style: italic;
      }
    </style>
  </head>

  <body>

    <!-- Sélecteur de fond -->
    <select id="basemap-selector">
      <option value="white">Fond blanc</option>
      <option value="ortho">Orthophoto</option>
      <option value="osm">OpenStreetMap</option>
    </select>

    <!-- Carte -->
    <div id="map"></div>

    <!-- Légende -->
    <div id="legend">

      <!-- Bouton -->
      <div id="legend-header">
        Légende
      </div>

      <!-- Contenu -->
      <div id="legend-content">
        <div id="legend-items"></div>
      </div>

    </div>

    <script>
      /* Style BDTOPO */
      const url_style = "geojson/delestage.json";

      /* Chargement du style */
      fetch(url_style)
        .then(res => res.json())
        .then(style => {

          /* Création de la carte */
          const map = new maplibregl.Map({
            container: 'map',
            style: style,
            center: [2.96099, 50.62369],
            zoom: 16,
            attributionControl: false
          });

          /* Attribution de la carte */
          map.addControl(
            new maplibregl.AttributionControl({
              compact: true
            })
          );

          /* Chargement de la carte */
          map.on('load', function () {

            /* Sources des fonds */

            /* OpenStreetMap */
            map.addSource('osm', {
              type: 'raster',
              tiles: [
                'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
              ],
              tileSize: 256,
              attribution: '© OpenStreetMap contributors'
            });

            /* Orthophoto IGN */
            map.addSource('ortho', {
              type: 'raster',
              tiles: [
                'https://data.geopf.fr/wmts?' +
                'SERVICE=WMTS' +
                '&REQUEST=GetTile' +
                '&VERSION=1.0.0' +
                '&LAYER=ORTHOIMAGERY.ORTHOPHOTOS' +
                '&STYLE=normal' +
                '&FORMAT=image/jpeg' +
                '&TILEMATRIXSET=PM' +
                '&TILEMATRIX={z}' +
                '&TILEROW={y}' +
                '&TILECOL={x}'
              ],
              tileSize: 256,
              attribution: '© IGN'
            });

            /* Couches de fond */

            /* Fond blanc */
            map.addLayer({
              id: 'fond-blanc',
              type: 'background',
              paint: {
                'background-color': '#ffffff'
              }
            }, getFirstLayerId());

            /* OpenStreetMap */
            map.addLayer({
              id: 'fond-osm',
              type: 'raster',
              paint: {
                'raster-opacity': 0.7
              },
              source: 'osm'
            }, getFirstLayerId());

            /* Orthophoto IGN */
            map.addLayer({
              id: 'fond-ortho',
              type: 'raster',
              paint: {
                'raster-opacity': 0.5
              },
              source: 'ortho'
            }, getFirstLayerId());

            /* Fond par défaut */
            setBasemap('ortho');

            document
              .getElementById('basemap-selector')
              .value = 'ortho';

            /* Sélecteur de fond */
            document
              .getElementById('basemap-selector')
              .addEventListener(
                'change',
                function () {
                  setBasemap(this.value);
                }
              );

            /* Génération de la légende */
            createLegend();

            /* Ouverture / fermeture de la légende */
            document
              .getElementById('legend-header')
              .addEventListener('click', function () {

                const legend = document.getElementById('legend');

                legend.classList.toggle('open');

                this.textContent =
                  legend.classList.contains('open')
                    ? 'Importance'
                    : 'Légende';
              });

            /* Fonction de changement de fond */
            function setBasemap(basemap) {

              map.setLayoutProperty(
                'fond-blanc',
                'visibility',
                basemap === 'white'
                  ? 'visible'
                  : 'none'
              );

              map.setLayoutProperty(
                'fond-osm',
                'visibility',
                basemap === 'osm'
                  ? 'visible'
                  : 'none'
              );

              map.setLayoutProperty(
                'fond-ortho',
                'visibility',
                basemap === 'ortho'
                  ? 'visible'
                  : 'none'
              );
            }

            /* Première couche de style */
            function getFirstLayerId() {

              const layers =
                map.getStyle().layers;

              if (
                layers &&
                layers.length > 0
              ) {
                return layers[0].id;
              }

              return undefined;
            }

            /* Création automatique de la légende */
            function createLegend() {

              const legendItems =
                document.getElementById(
                  'legend-items'
                );

              /* On vide la légende */
              legendItems.innerHTML = '';

              /* Récupération des couches */
              const layers =
                map.getStyle().layers;

              /* Permet d'éviter les doublons */
              const alreadyAdded =
                new Set();

              /* Correspondance entre les identifiants des couches et les libellés */
              const labels = {
                "importance_1": "Importance 1",
                "importance_2": "Importance 2",
                "importance_3": "Importance 3",
                "importance_4": "Importance 4",
                "importance_5": "Importance 5",
                "importance_6": "Importance 6"
              };

              /* Parcours des couches */
              layers.forEach(function (layer) {

                /* On ne conserve que les tronçons de route */
                if (layer['source-layer'] !== 'troncon_de_route') {
                  return;
                }

                /* On ne traite que les couches linéaires */
                if (layer.type !== 'line') {
                  return;
                }

                /* Récupération de la couleur */
                let color = null;

                if (
                  layer.paint &&
                  layer.paint['line-color']
                ) {
                  color = layer.paint['line-color'];
                }

                /* Pas de couleur = pas de légende */
                if (!color) {
                  return;
                }

                /* Récupération du libellé */
                let label = labels[layer.id];

                /* Pas de libellé = on ignore la couche */
                if (!label) {
                  return;
                }

                /* Clé permettant d'éviter les doublons */
                const key =
                  (layer['source-layer'] || '') +
                  '|' +
                  label;

                if (alreadyAdded.has(key)) {
                  return;
                }

                alreadyAdded.add(key);

                /* Création de l'élément HTML */
                const item =
                  document.createElement('div');

                item.className =
                  'legend-item';

                /* Création du symbole */
                const symbol =
                  document.createElement('span');

                /* Couches linéaires */
                symbol.className = 'legend-line';

                const paint = layer.paint || {};

                const svgNS = 'http://www.w3.org/2000/svg';

                const svg = document.createElementNS(svgNS, 'svg');

                svg.setAttribute('width', '30');
                svg.setAttribute('height', '10');
                svg.setAttribute('viewBox', '0 0 30 10');

                /* Cas particulier : escalier */
                if (layer.id === 'escalier-outline') {

                  /* Trait extérieur */
                  const outline = document.createElementNS(svgNS, 'line');

                  outline.setAttribute('x1', '0');
                  outline.setAttribute('y1', '5');
                  outline.setAttribute('x2', '30');
                  outline.setAttribute('y2', '5');
                  outline.setAttribute('stroke', '#2d3427');
                  outline.setAttribute('stroke-width', '2');

                  svg.appendChild(outline);

                  /* Trait intérieur */
                  const inline = document.createElementNS(svgNS, 'line');

                  inline.setAttribute('x1', '0');
                  inline.setAttribute('y1', '5');
                  inline.setAttribute('x2', '30');
                  inline.setAttribute('y2', '5');
                  inline.setAttribute('stroke', '#ffffff');
                  inline.setAttribute('stroke-width', '1.8');
                  inline.setAttribute('stroke-dasharray', '5.4 0.36');

                  svg.appendChild(inline);

                }

                /* Autres couches linéaires */
                else {

                  const line = document.createElementNS(svgNS, 'line');

                  line.setAttribute('x1', '0');
                  line.setAttribute('y1', '5');
                  line.setAttribute('x2', '30');
                  line.setAttribute('y2', '5');

                  line.setAttribute(
                    'stroke',
                    paint['line-color'] || '#000000'
                  );

                  const width = paint['line-width'] || 2;

                  line.setAttribute('stroke-width', width);

                  const dashArray = paint['line-dasharray'];

                  if (Array.isArray(dashArray)) {

                    line.setAttribute(
                      'stroke-dasharray',
                      dashArray.map(value => value * width).join(' ')
                    );
                  }

                  svg.appendChild(line);
                }

                symbol.appendChild(svg);

                /* Texte */
                const text =
                  document.createElement('span');

                text.textContent = label;

                /* Assemblage */
                item.appendChild(symbol);
                item.appendChild(text);
                legendItems.appendChild(item);
              });

              /* Si aucun élément */
              if (legendItems.children.length === 0) {

                const empty =
                  document.createElement('div');

                empty.className =
                  'legend-empty';

                empty.textContent =
                  'Aucun élément à afficher';

                legendItems.appendChild(empty);
              }
            }
          });
        })

        .catch(function (error) {

          console.error(
            'Erreur lors du chargement du style BDTOPO :',
            error
          );
        });
    </script>

  </body>

</html>
